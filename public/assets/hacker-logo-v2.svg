<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="phantomBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#040711" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Toxic Neon Lime to Electric Cyan Gradient -->
    <linearGradient id="toxicNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#00f59b" />
      <stop offset="70%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Hot Neon Cyan -->
    <linearGradient id="cyanLaser" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f59b" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Dark Carbon Metal Gradient -->
    <linearGradient id="carbonFacetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="carbonFacetB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152033" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <!-- Intense Neon Glow -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Aura -->
    <filter id="auraGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" result="aura" />
    </filter>
  </defs>

  <!-- Container Base with Rounded Squircle Shape -->
  <rect width="512" height="512" rx="120" fill="url(#phantomBg)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#toxicNeon)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Background Ambient Cyber Aura -->
  <circle cx="256" cy="245" r="140" fill="#00f59b" opacity="0.12" filter="url(#auraGlow)" />
  <circle cx="256" cy="245" r="100" fill="#00e5ff" opacity="0.1" filter="url(#auraGlow)" />

  <!-- Radial Cyber Radar / Target Rings -->
  <g opacity="0.12" stroke="#00e5ff" stroke-width="1.2" fill="none">
    <circle cx="256" cy="240" r="190" stroke-dasharray="8 12" />
    <circle cx="256" cy="240" r="150" />
    <circle cx="256" cy="240" r="105" stroke-dasharray="4 8" />
    <!-- Crosshairs -->
    <line x1="256" y1="35" x2="256" y2="70" />
    <line x1="256" y1="410" x2="256" y2="445" />
    <line x1="50" y1="240" x2="85" y2="240" />
    <line x1="427" y1="240" x2="462" y2="240" />
  </g>

  <!-- Outer Cyber Crest Shield Outline -->
  <path d="M 256 52 
           L 404 116 
           L 404 268 
           C 404 350, 336 414, 256 456 
           C 176 414, 108 350, 108 268 
           L 108 116 Z"
        fill="none"
        stroke="url(#toxicNeon)"
        stroke-width="3.5"
        stroke-linejoin="round"
        filter="url(#intenseGlow)"
        opacity="0.85"
  />

  <!-- High-Tech Circuit Traces around Shield -->
  <g stroke="#00f59b" stroke-width="2" opacity="0.5" fill="none">
    <!-- Top Left Nodes -->
    <polyline points="108,116 68,96 46,96" />
    <circle cx="46" cy="96" r="3.5" fill="#00f59b" />
    <!-- Top Right Nodes -->
    <polyline points="404,116 444,96 466,96" />
    <circle cx="466" cy="96" r="3.5" fill="#00e5ff" />
    <!-- Mid Left Nodes -->
    <polyline points="108,240 64,240 48,256" />
    <circle cx="48" cy="256" r="3.5" fill="#00f59b" />
    <!-- Mid Right Nodes -->
    <polyline points="404,240 448,240 464,256" />
    <circle cx="464" cy="256" r="3.5" fill="#00e5ff" />
  </g>

  <!-- ================= CYBER SKULL / PHANTOM OPERATIVE ================= -->
  <!-- Skull Cranium Main Outer Structure -->
  <g id="cranium">
    <!-- Center Forehead Ridge Plate -->
    <polygon points="256,104 294,142 256,168 218,142" fill="url(#carbonFacetA)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Left Forehead Facet -->
    <polygon points="218,142 256,104 186,126 156,172 208,172" fill="url(#carbonFacetB)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Right Forehead Facet -->
    <polygon points="256,104 294,142 304,172 356,172 326,126" fill="url(#carbonFacetA)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Left Temple Plate -->
    <polygon points="156,172 208,172 198,212 144,212" fill="url(#carbonFacetA)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Right Temple Plate -->
    <polygon points="356,172 304,172 314,212 368,212" fill="url(#carbonFacetB)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Center Glabella Bridge -->
    <polygon points="256,168 294,142 304,172 284,212 256,218 228,212 208,172 218,142" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- ================= GLOWING CYBER VISOR / SCANNING HUD ================= -->
  <!-- Visor Housing Frame -->
  <polygon points="152,216 230,224 256,228 282,224 360,216 348,256 280,268 256,270 232,268 164,256"
           fill="#030712"
           stroke="#10b981"
           stroke-width="2"
  />

  <!-- Active Neon Scanning Laser Beam Eye Slot -->
  <polygon points="160,226 232,234 256,236 280,234 352,226 342,246 278,256 256,258 234,256 170,246"
           fill="url(#cyanLaser)"
           filter="url(#intenseGlow)"
  />

  <!-- HUD Reticle Points in Eyes -->
  <circle cx="204" cy="236" r="3" fill="#ffffff" filter="url(#intenseGlow)" />
  <circle cx="308" cy="236" r="3" fill="#ffffff" filter="url(#intenseGlow)" />

  <!-- ================= LOWER FACE / CHEEKBONES / JAW ================= -->
  <!-- Left Cheekbone Plate -->
  <polygon points="164,256 232,268 214,316 160,296" fill="url(#carbonFacetB)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Right Cheekbone Plate -->
  <polygon points="348,256 280,268 298,316 352,296" fill="url(#carbonFacetA)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Center Nose Cavity / Cryptographic Keyhole Inverted Triangle -->
  <polygon points="256,274 270,306 242,306" fill="#000000" stroke="#00f59b" stroke-width="1.5" />

  <!-- Left Maxilla / Cyber Filter Plate -->
  <polygon points="232,268 256,274 256,334 214,316" fill="#0d1527" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Right Maxilla / Cyber Filter Plate -->
  <polygon points="280,268 256,274 256,334 298,316" fill="#090e1a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Digital Teeth / Binary Port Vents (4 glowing slots) -->
  <g stroke="url(#toxicNeon)" stroke-width="3" stroke-linecap="round" filter="url(#intenseGlow)">
    <line x1="230" y1="328" x2="230" y2="348" />
    <line x1="244" y1="332" x2="244" y2="352" />
    <line x1="256" y1="334" x2="256" y2="354" />
    <line x1="268" y1="332" x2="268" y2="352" />
    <line x1="282" y1="328" x2="282" y2="348" />
  </g>

  <!-- Angular Cyber Jaw / Chin Plate -->
  <polygon points="214,352 256,368 298,352 284,394 256,406 228,394"
           fill="url(#carbonFacetA)"
           stroke="url(#toxicNeon)"
           stroke-width="2"
           stroke-linejoin="round"
  />

  <!-- Terminal Command Prompt Accent at Chin: >_ -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#intenseGlow)">
    <polyline points="244,382 253,388 244,394" fill="none" stroke="#00f59b" />
    <line x1="259" y1="394" x2="269" y2="394" stroke="#00e5ff" />
  </g>

  <!-- Zero-Day / Security Code Watermarks -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#00f59b" opacity="0.4" font-weight="bold">
    <text x="122" y="160">ROOT</text>
    <text x="352" y="160">0x00</text>
    <text x="120" y="360">SEC</text>
    <text x="358" y="360">VAPT</text>
  </g>
</svg>
